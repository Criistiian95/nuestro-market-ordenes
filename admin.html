<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración · Nuestro Market</title><style>
body{margin:0;background:#f3f6f4;color:#15352c;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.hero{background:#0d4135;color:white;border-radius:20px;padding:20px}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:#cfe2dc}.card{background:white;border:1px solid #dbe5e1;border-radius:16px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#60736c;margin-bottom:6px}.field input{width:100%;height:42px;border:1px solid #cbd8d3;border-radius:10px;padding:0 10px;box-sizing:border-box}.upload{border:1.5px dashed #a9bdb6;border-radius:12px;padding:14px;margin-top:8px}.btn{height:42px;border:0;border-radius:10px;padding:0 14px;background:#166a4b;color:white;font-weight:800;cursor:pointer}.state{font-size:12px;color:#65736e;margin-top:8px}.ok{color:#176b4c;font-weight:700}.bad{color:#b42318;font-weight:700}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:12px}.k{background:#f7faf8;border-radius:11px;padding:11px}.k span{font-size:10px;color:#6c7b76;text-transform:uppercase}.k b{display:block;font-size:20px;margin-top:3px}@media(max-width:700px){.grid,.status{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><div class="wrap"><div class="hero"><h1>Nuestro Market</h1><p>Administración de la base de órdenes de compra</p></div>
<section class="card"><div class="grid"><div class="field"><label>PIN administrador</label><input id="pin" type="password" placeholder="PIN"></div><div style="display:flex;align-items:end"><button class="btn" onclick="refresh()">Actualizar estado</button></div></div>
<div class="status"><div class="k"><span>Costos</span><b id="c">0</b></div><div class="k"><span>Stock</span><b id="s">0</b></div><div class="k"><span>Ventas</span><b id="v">0</b></div><div class="k"><span>Artículos activos</span><b id="a">0</b></div></div></section>
<section class="card"><h3>Actualizar archivos</h3><p style="color:#65736e;font-size:13px">Estos archivos quedan guardados en el servidor y los encargados no tienen que cargarlos.</p>
<div class="upload"><b>Costos / Maestro</b><input id="costs" type="file" accept=".xls,.xlsx,.csv,.tsv,.txt"><button class="btn" onclick="sendFile('costs')">Subir Costos</button><div id="scosts" class="state"></div></div>
<div class="upload"><b>Stock actual</b><input id="stock" type="file" accept=".xls,.xlsx,.csv,.tsv,.txt"><button class="btn" onclick="sendFile('stock')">Subir Stock</button><div id="sstock" class="state"></div></div>
<div class="upload"><b>Ventas día a día</b><input id="sales" type="file" accept=".xls,.xlsx"><button class="btn" onclick="sendFile('sales')">Subir Ventas</button><div id="ssales" class="state"></div></div></section>
<section class="card"><a href="/" style="color:#166a4b;font-weight:800">← Volver a Órdenes de compra</a></section></div>
<script>
async function refresh(){const r=await fetch('/api/status',{cache:'no-store'}),j=await r.json();document.querySelector('#c').textContent=j.costs||0;document.querySelector('#s').textContent=j.stock||0;document.querySelector('#v').textContent=j.sales||0;document.querySelector('#a').textContent=j.meta?.articles||0}
function to64(buf){let b='',u=new Uint8Array(buf),chunk=0x8000;for(let i=0;i<u.length;i+=chunk)b+=String.fromCharCode(...u.subarray(i,Math.min(i+chunk,u.length)));return btoa(b)}
async function sendFile(type){const inp=document.querySelector('#'+type),st=document.querySelector('#s'+type),f=inp.files?.[0];if(!f){st.innerHTML='<span class="bad">Elegí un archivo.</span>';return}st.textContent='Subiendo…';try{const dataBase64=to64(await f.arrayBuffer());const r=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,filename:f.name,pin:document.querySelector('#pin').value,dataBase64})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');st.innerHTML='<span class="ok">Cargado: '+j.count+' registros. '+(j.ready?'Base lista con '+j.articles+' artículos.':'Faltan archivos.')+'</span>';refresh()}catch(e){st.innerHTML='<span class="bad">'+String(e.message||e)+'</span>'}}
refresh();
</script></body></html>
